name: Build Windows EXE Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build syspulse.exe
        run: pyinstaller --onefile --name syspulse main.py

      - name: Upload syspulse.exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/syspulse.exe
