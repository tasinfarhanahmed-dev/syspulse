name: Build Windows EXE Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install psutil pyinstaller
      - name: Build syspulse.exe
        run: pyinstaller --onefile --name syspulse main.py
      - name: Upload syspulse.exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/syspulse.exe
